            box-sizing: border-box;
        }
        .search-box {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #3b82f6;
            border-radius: 8px;
            background-color: #1e293b;
            color: white;
            cursor: pointer;
            outline: none;
        }
        /* 右上角 8591 賣場藍色按鈕 */

            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: background 0.2s;
        }
        .shop-btn:hover {
            background-color: #1d4ed8;
        }

        /* 網頁主體內容區塊 */
        .main-card {

            max-width: 650px;
            border-radius: 16px;

            text-align: center;
            margin-top: 20px;
            box-sizing: border-box;
        }

        /* 遊戲標題與標籤 */
        .game-title {
            font-size: 28px;
            font-weight: bold;
            color: #1e1b4b;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .game-tags {
            color: #ef4444;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* 每一行按鈕與說明的橫條排版 */
        .row-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f1f5f9;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 5px solid #3b82f6;
            text-align: left;
        }
        .text-info {
            flex: 1;
            padding-right: 15px;
        }
        .text-title {
            font-size: 16px;
            font-weight: bold;
            color: #1e293b;
        }
        .text-desc {

            color: #64748b;
            margin-top: 3px;

            color: white;

            font-size: 14px;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .green-btn:hover {

        /* 底部免責聲明 */

            color: #94a3b8;
            margin-top: 40px;
